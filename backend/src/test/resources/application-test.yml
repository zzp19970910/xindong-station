spring:
  datasource:
    url: jdbc:h2:mem:xindong_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.community.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 100ms
      lettuce:
        pool:
          max-active: 2
          max-idle: 1
app:
  jwt:
    secret: "test-jwt-secret-test-jwt-secret-test-jwt-secret-test-jwt-secret-test-jwt-secret"
    expire-hours: 720
  aes:
    letter-key: "test-letter-aes-key-min-16-chars-32-bytes-long-enough"
  sms:
    super-code: "1234"
  invite-code-charset: "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
  cache:
    ttl-seconds:
      dashboard: 60
      daily-quiz: 300
      icebreak-session: 3600
      invite-code: 86400
      coin-overview: 30
      couple-info: 180
  coin-daily-limits:
    login: 25
    content: 50
    interactive: 50
  downgrade:
    feature:
      quiz-enabled: true
      icebreak-enabled: true
      time-capsule-enabled: true
      couple-binding-enabled: true
      cooling-mode-enabled: true
    cache:
      dashboard-enabled: false
      coin-overview-enabled: false
    readonly-enabled: false
logging:
  level:
    root: WARN
    com.xindong: INFO