server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-response: true
    # ⚠️绝对不要用context-path! 前后端一体化部署请用主配置application.yml的 spring.mvc.servlet.path=/api/v1
    #   context-path会强制给静态资源/Actuator/Vue History都加前缀→全404/30006! 主配置已经统一配置不用再重复
    context-path:

spring:
  config:
    activate:
      on-profile: render

  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
      - org.springframework.boot.autoconfigure.session.SessionRepositoryCustomizer
      - org.springframework.session.data.redis.config.annotation.web.http.RedisHttpSessionConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisHealthContributorAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.data.redis.RedisReactiveHealthContributorAutoConfiguration

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=300s

  data:
    redis:
      host: 127.0.0.1  # 兜底配置，就算漏了也立刻CONNREFUSED，不卡启动
      port: 16379
      connect-timeout: 200ms
      timeout: 200ms
      lettuce:
        shutdown-timeout: 100ms
        pool:
          max-active: 1
          max-idle: 0
          min-idle: 0

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/xindong}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 5000
      validation-timeout: 1000
      idle-timeout: 60000
      max-lifetime: 180000
      initialization-fail-timeout: -1  # DB初始化失败也不卡启动，配合SeedRunner兜底

  jpa:
    hibernate:
      ddl-auto: update  # render用update，不再每次DROP+CREATE重建，启动秒级
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: false

management:
  endpoint:
    health:
      enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false
    db:
      enabled: true
    diskspace:
      enabled: true
    ping:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  aes:
    letter-key: ${LETTER_AES_KEY:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

downgrade:
  cache:
    redis-bypass: true  # Render没Redis，强制用Caffeine本地缓存，跳过所有Redis Bean
  feature:
    icebreak: true
    weekly-report: true

logging:
  level:
    root: WARN
    com.xindong: INFO
    org.springframework.security: WARN
    org.springframework.boot.autoconfigure: ERROR
    io.lettuce: ERROR
    org.redisson: ERROR