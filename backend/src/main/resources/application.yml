spring:
  application:
    name: xindong-station
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    servlet:
      # Spring Boot 3 官方推荐单JAR前后端部署：只改DispatcherServlet路径，Tomcat DefaultServlet独立处理静态资源/Actuator/Vue
      # ✅ Controller /auth/** → /api/v1/auth/** 完美匹配前端axios baseURL=/api/v1
      # ✅ classpath:/static/index.html → 域名根路径 / 直接返回, 不用加/api/v1
      # ✅ Actuator /actuator/health → 根路径下可访问, Render健康检查通过
      # ✅ Vue History /login, /settings/coin-center → WebMvcConfig Interceptor forward /index.html 完美
      path: /api/v1
  task:
    execution:
      pool:
        core-size: 16
        max-size: 32
        queue-capacity: 100
        thread-name-prefix: xindong-io-
    scheduling:
      pool:
        size: 4
        thread-name-prefix: xindong-sched-

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path:  # 绝对不要用! 会把静态资源/Actuator/Vue History都强制加前缀全404/30006
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32bytes!!!}
    expire-hours: 720
  aes:
    letter-key: ${LETTER_AES_KEY:letter-aes-key-change-me-please-32bytes!}
  sms:
    super-code: ${SMS_SUPER_CODE:1234}
    ali-access-key: ${ALI_SMS_AK:}
    ali-secret-key: ${ALI_SMS_SK:}
    ali-sign-name: 心动空间站
    ali-template-code: SMS_XXXXXX
  invite-code:
    charset: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    length: 6
  cache:
    dashboard-ttl-seconds: 60
    daily-quiz-ttl-hours: 24
    icebreak-session-ttl-hours: 24
  coin:
    daily-limit-login: 25
    daily-limit-content: 50
    daily-limit-interactive: 50

downgrade:
  feature:
    icebreak: true
    weekly-report: true
  cache:
    redis-bypass: false
  readonly:
    enable: false