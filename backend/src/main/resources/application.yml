spring:
  application:
    name: xindong-station
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
  mvc:
    servlet:
      # ⚠️ 绝对不要再加path=/api/v1! 前端打包时axios请求路径是/auth/login这种裸路径,
      # 加了servlet.path之后DispatcherServlet根本收不到/auth请求→404→前端显示"网络异常"!
      # 静态资源/Actuator/Vue History都走默认根路径就好，和Controller的@RequestMapping直接匹配
      path:  # 留空=根路径/，和前端打包的API路径100%对齐！
  task:
    execution:
      pool:
        core-size: 16
        max-size: 32
        queue-capacity: 100
        thread-name-prefix: xindong-io-
    scheduling:
      pool:
        size: 4
        thread-name-prefix: xindong-sched-

server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path:  # 绝对不要用! 会把静态资源/Actuator/Vue History都强制加前缀全404/30006
  tomcat:
    max-threads: 200
    accept-count: 100
    connection-timeout: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-change-me-please-32bytes!!!}
    expire-hours: 720
  aes:
    letter-key: ${LETTER_AES_KEY:letter-aes-key-change-me-please-32bytes!}
  sms:
    super-code: ${SMS_SUPER_CODE:1234}
    ali-access-key: ${ALI_SMS_AK:}
    ali-secret-key: ${ALI_SMS_SK:}
    ali-sign-name: 心动空间站
    ali-template-code: SMS_XXXXXX
  invite-code:
    charset: ABCDEFGHJKLMNPQRSTUVWXYZ23456789
    length: 6
  cache:
    dashboard-ttl-seconds: 60
    daily-quiz-ttl-hours: 24
    icebreak-session-ttl-hours: 24
  coin:
    daily-limit-login: 25
    daily-limit-content: 50
    daily-limit-interactive: 50

downgrade:
  feature:
    icebreak: true
    weekly-report: true
  cache:
    redis-bypass: false
  readonly:
    enable: false