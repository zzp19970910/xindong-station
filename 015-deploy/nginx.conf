# ============================================================
#  Nginx 反向代理配置：HTTP→HTTPS强制跳转 + 静态缓存 + 反代到SpringBoot
#  注意：把下面所有 your-domain.com 替换成你自己的域名（有www就加，没有就删）
# ============================================================

# ---------- 1. 所有 HTTP 请求强制跳转 HTTPS ----------
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt 证书申请验证路径（不要动）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他所有请求 301 永久跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 2. HTTPS 主入口 ----------
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # SSL 证书路径（Certbot自动申请后会放在这里，不用改）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # 安全头（浏览器端安全加固）
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传文件大小限制（和SpringBoot配置一致：10MB单文件，50MB总请求）
    client_max_body_size 50M;

    # Gzip 压缩（大幅减小前端资源加载体积，提升速度）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---------- 3. 前端静态资源：直接由Nginx提供，加上长缓存 ----------
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        # 反代到 SpringBoot 的 classpath:static/（因为是合包模式，前端资源在jar里）
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 静态资源缓存一年（hash文件名，Vite构建会自动加hash，改代码文件名会变，不会缓存旧版本）
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---------- 4. 所有其他请求（API + 前端SPA路由）：反代到 SpringBoot ----------
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（如果以后加实时聊天功能直接能用）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
}